    <p>　最終日。<br>
　スミソニアン航空系別館へ。車で片道一時間ほど。<br>
　月光、屠龍、震電、晴嵐、紫電改、エノラ・ゲイ。<br>
　帰り道、前が見えないレベルの降雨。コスプレのひとたち大丈夫か。<br>
　昼ご飯はショッピングモールでフォー。<br>
　ショッピングモールでの食事が重すぎたため、皆動きが鈍い。晩ご飯は、Five Guys のハンバーガー。ミルクシェイクのトッピングにベーコンがあったので試す。合っている。</p>
