    <p>　さすがに小説を書きはじめる。４枚。<br>
「目羅博士の不思議な犯罪」読む。<br>
「黄金仮面」読む。これがシュオブの影響、というのが偉いな。<br>
　生落花生茹でる。<br>
　マナガツオ第２弾（終了）。味噌汁（ネギ）。木耳肉。栃尾揚げ。<br>
『<a href="https://www.chikumashobo.co.jp/product/9784480017277/">乱歩とモダン東京</a>』、<br>
『<a href="https://comic-zenon.com/episode/2550689798794030464">列強戦線</a> ８』、<br>
　読む。</p>
