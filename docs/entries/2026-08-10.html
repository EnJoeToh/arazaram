　洋館は予想していたが、地下室、塔がやたらと多い。<br>
　ワシントン D.C.での皿を再現するべく、マグロを生姜とニンニクで漬けにして焼いてみる。当たり前だが焦げる。<br>
　蒸し茄子と、お湯でゆるくした芝麻醤＋塩。<br>
　また、トウモロコシやキュウリは痩せ、トマトが高くなってきている。</p>
