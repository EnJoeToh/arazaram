    <p>　朝食昼食は、ブルールームにあるものを自由に、とのこと。米と味噌汁と漬物が山になっている。<br>
　サイン会。プロデューサーと脚本のサインが欲しい人がどのくらいいるのかという話ではあるが盛況。<br>
　空き時間で自然史博物館へ。銅１ポンドと、硅化木を買う。スミソニアン航空系の本館へ。桜花が展示されている。<br>
　バンダイナムコ企業パネルの冒頭部に出る。<br>
